# BMStore Redis 7 — tenant cache today, job queues later (BullMQ-style).
# Password comes from the command line (--requirepass) so it is never stored in this file.
bind 0.0.0.0
protected-mode yes
port 6379
# Persistence: AOF (every second) + RDB snapshots. Survives restarts; queues are not lost.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
dir /data
# Memory: evict ONLY keys that have a TTL (tenant cache). Queue/refresh keys without TTL are never dropped.
maxmemory 256mb
maxmemory-policy volatile-lru
# Hardening: disable dangerous commands.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
# Misc
tcp-keepalive 300
timeout 0
loglevel notice
