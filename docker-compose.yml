# Local dev dependencies for your laptop:  docker compose up -d
# (The API itself runs with `npm run start:dev -w apps/api`.)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bmstore
      POSTGRES_PASSWORD: bmstore
      POSTGRES_DB: bmstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmstore -d bmstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local object storage (S3-compatible). Production: R2 or S3 via the same S3_* env vars.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bmstore
      MINIO_ROOT_PASSWORD: bmstore-minio
    ports:
      - "9000:9000"   # S3 API  -> S3_ENDPOINT=http://localhost:9000
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once and makes it publicly readable (images are served straight from it).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bmstore bmstore-minio &&
      mc mb --ignore-existing local/bmstore &&
      mc anonymous set download local/bmstore
      "

volumes:
  pgdata:
  miniodata:
