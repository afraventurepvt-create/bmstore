# Local dev dependencies for your laptop:  docker compose up -d
# (The API itself runs with `npm run start:dev -w apps/api`.)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bmstore
      POSTGRES_PASSWORD: bmstore
      POSTGRES_DB: bmstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmstore -d bmstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
